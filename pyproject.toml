[project]
name = "safe-mcp-suite"
version = "0.1.0"
description = "Safe MCP suite"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["safety*", "servers*", "config*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
