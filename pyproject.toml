[project]
name = "safe-mcp-suite"
version = "0.1.0"
description = "Safe MCP suite"
requires-python = ">=3.12"
# The only third-party dependency in the project, and it stops at the servers:
# safety/ imports nothing outside the standard library and must stay that way.
dependencies = ["mcp>=2.0"]

[project.scripts]
safe-mcp = "servers.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["safety*", "servers*", "config*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
